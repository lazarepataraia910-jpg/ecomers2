<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites | Healthy Recipe Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <section class="page-intro">
      <h1>Your favorite recipes</h1>
      <p>Tap the heart on any recipe to save it here.</p>
    </section>
    <div class="recipe-grid" id="grid"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/layout.js"></script>
  <script type="module">
    import { fetchAllRecipes } from "./js/store.js";

    renderHeader("favorites");
    renderFooter();

    const grid = document.getElementById("grid");
    const recipes = await fetchAllRecipes();

    function render() {
      const favs = getFavorites();
      const list = recipes.filter((r) => favs.includes(r.slug));
      grid.innerHTML = list.length
        ? list.map(recipeCard).join("")
        : '<p class="empty-state">No favorites yet. <a href="recipes.html"><strong>Browse recipes</strong></a> and tap the heart.</p>';
    }

    // Un-hearting a card removes it from this page.
    document.addEventListener("favorites-changed", render);
    render();
  </script>
</body>
</html>
